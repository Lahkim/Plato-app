<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLATO | Générateur AR</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #FF4D00; --bg: #000; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .container { max-width: 500px; width: 100%; }
        h1 { font-size: 28px; margin-bottom: 5px; color: var(--p); }
        p { opacity: 0.7; margin-bottom: 30px; }
        label { display: block; margin-top: 15px; font-size: 14px; opacity: 0.8; }
        input { width: 100%; padding: 18px; margin-top: 5px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; box-sizing: border-box; font-size: 16px; }
        .btn { background: var(--p); color: #fff; border: none; padding: 20px; width: 100%; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 25px; cursor: pointer; }
        .qr-card { background: #fff; color: #000; padding: 30px; border-radius: 25px; margin-top: 30px; text-align: center; width: 100%; box-sizing: border-box; }
        #qrcode img { margin: 0 auto; }
        .footer-link { margin-top: 30px; font-size: 12px; opacity: 0.4; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PLATO</h1>
        <p>Générateur de Menu en Réalité Augmentée</p>

        <label>Nom du plat</label>
        <input type="text" id="name" placeholder="ex: Tajine d'Oujda">

        <label>Prix</label>
        <input type="text" id="price" placeholder="ex: 95.00 MAD">

        <label>Lien Capture (Luma ou Polycam)</label>
        <input type="text" id="luma" placeholder="Collez le lien ici">

        <button class="btn" onclick="generate()">CRÉER L'EXPÉRIENCE CLIENT</button>

        <div id="result" class="qr-card" style="display:none;">
            <div id="qrcode"></div>
            <p style="margin-top:15px; font-weight:bold;">QR Code prêt !</p>
            <p id="link-text" style="font-size:10px; color:#888; word-break:break-all;"></p>
        </div>
        
        <div class="footer-link">PLATO Infrastructure v1.0</div>
    </div>

<script>
    function generate() {
        const rawLuma = document.getElementById('luma').value;
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        
        const parts = rawLuma.split('/');
        const id = parts[parts.length - 1] || parts[parts.length - 2];

        // On pointe vers la page de visualisation (view.html)
        const finalUrl = window.location.origin + "/view.html?id=" + id + "&name=" + encodeURIComponent(n) + "&price=" + encodeURIComponent(p);

        document.getElementById('result').style.display = 'block';
        document.getElementById('qrcode').innerHTML = "";
        
        new QRCode(document.getElementById("qrcode"), {
            text: finalUrl,
            width: 220,
            height: 220
        });
        
        document.getElementById('link-text').innerText = finalUrl;
    }
</script>
</body>
</html>
