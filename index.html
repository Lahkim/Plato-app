<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLATO | Premium AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --primary: #FF4D00;
            --glass: rgba(255, 255, 255, 0.8);
            --dark: #0A0A0B;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #F8F9FA;
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
        }

        /* --- VUE CLIENT : LUXE & ÉPURE --- */
        #client-view { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        model-viewer {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ffffff 0%, #f1f1f1 100%);
            --poster-color: transparent;
        }

        .client-header {
            position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10;
        }

        .brand-pill {
            background: var(--dark); color: white; padding: 8px 16px; border-radius: 100px;
            font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
        }

        .client-card {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 30px; border-radius: 32px; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center;
        }

        h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .price { color: var(--primary); font-weight: 600; font-size: 18px; margin: 5px 0 20px 0; }

        .btn-ar {
            background: var(--primary); color: white; border: none; padding: 20px;
            border-radius: 18px; width: 100%; font-weight: 700; font-size: 16px;
            box-shadow: 0 10px 25px rgba(255, 77, 0, 0.3); transition: transform 0.2s;
        }

        /* --- DASHBOARD ADMIN : DARK MODE SLEEK --- */
        #admin-panel { 
            display: none; min-height: 100vh; background: var(--dark); 
            padding: 40px 25px; box-sizing: border-box; color: white;
        }

        .admin-header h2 { font-size: 32px; font-weight: 800; margin-bottom: 40px; }
        
        .input-group { margin-bottom: 25px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 8px; text-transform: uppercase; }
        
        input {
            width: 100%; background: #151517; border: 1px solid #222; padding: 18px;
            border-radius: 16px; color: white; font-size: 16px; box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        .qr-result {
            margin-top: 40px; background: white; padding: 30px; border-radius: 32px;
            animation: slideUp 0.5s ease;
        }

        #qrcode canvas, #qrcode img { margin: 0 auto; border-radius: 12px; }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="client-view">
        <div class="client-header"><span class="brand-pill">PLATO AR EXPERIENCE</span></div>
        <model-viewer id="mv" ar ar-modes="scene-viewer quick-look webxr" camera-controls shadow-intensity="1" exposure="1.2">
            <div class="client-card">
                <h1 id="c-name">Gastronomie 3D</h1>
                <div id="c-price" class="price">Scannez un menu pour commander</div>
                <button slot="ar-button" class="btn-ar">VOIR LE PLAT À TABLE</button>
            </div>
        </model-viewer>
    </div>

    <div id="admin-panel">
        <div class="admin-header"><h2>PLATO<span>.</span></h2></div>
        
        <div class="input-group">
            <label>Nom du Chef-d'œuvre</label>
            <input type="text" id="name" placeholder="ex: Tajine Royal d'Agneau">
        </div>

        <div class="input-group">
            <label>Prix de vente</label>
            <input type="text" id="price" placeholder="ex: 120 MAD">
        </div>

        <div class="input-group">
            <label>Lien de Capture (Luma/Polycam)</label>
            <input type="text" id="luma" placeholder="Collez l'URL de partage">
        </div>

        <button class="btn-ar" style="margin-top: 20px;" onclick="process()">GÉNÉRER L'EXPÉRIENCE</button>
        
        <div id="result" class="qr-result" style="display:none;">
            <div id="qrcode"></div>
            <p id="link-text" style="color: #888; font-size: 11px; margin-top: 20px; word-break: break-all;"></p>
            <button onclick="window.print()" style="margin-top:10px; background:none; border:none; color:var(--primary); font-weight:700;">Imprimer le QR Code</button>
        </div>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    
    if(window.location.hash === "#admin") {
        document.getElementById('client-view').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
    } 
    else if(params.get('id')) {
        const id = params.get('id');
        const mv = document.getElementById('mv');
        mv.src = `https://cdn-luma.com/${id}/model.glb`;
        mv.iosSrc = `https://cdn-luma.com/${id}/model.usdz`;
        document.getElementById('c-name').innerText = params.get('name');
        document.getElementById('c-price').innerText = params.get('price');
    }

    function process() {
        const rawLuma = document.getElementById('luma').value;
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        
        const id = rawLuma.split('/').filter(p => p).pop();
        const finalUrl = window.location.origin + window.location.pathname + "?id=" + id + "&name=" + encodeURIComponent(n) + "&price=" + encodeURIComponent(p);

        document.getElementById('result').style.display = 'block';
        document.getElementById('qrcode').innerHTML = "";
        
        new QRCode(document.getElementById("qrcode"), {
            text: finalUrl,
            width: 220,
            height: 220,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
        
        document.getElementById('link-text').innerText = finalUrl;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
</body>
</html>
