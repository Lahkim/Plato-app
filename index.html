<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLATO CONTROL</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #FF4D00; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #000; color: #fff; }
        #client-view { display: block; height: 100vh; background: #fff; color: #000; }
        model-viewer { width: 100%; height: 80vh; }
        .admin-panel { display: none; padding: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; box-sizing: border-box; }
        .btn { background: var(--p); color: #fff; border: none; padding: 20px; width: 100%; border-radius: 15px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .qr-card { background: #fff; color: #000; padding: 20px; border-radius: 20px; margin-top: 20px; text-align: center; }
        #qrcode img { margin: 0 auto; }
    </style>
</head>
<body>

    <div id="client-view">
        <model-viewer id="mv" ar ar-modes="scene-viewer quick-look webxr" camera-controls shadow-intensity="1">
            <div style="padding: 20px; text-align: center;">
                <h1 id="c-name">PLATO AR</h1>
                <p id="c-price">En attente du menu...</p>
                <button slot="ar-button" class="btn">✨ PLACER LE PLAT SUR MA TABLE</button>
            </div>
        </model-viewer>
    </div>

    <div id="admin-panel">
        <h2>🚀 PLATO GENERATOR</h2>
        <input type="text" id="name" placeholder="Nom du plat (ex: Tajine)">
        <input type="text" id="price" placeholder="Prix (ex: 95 MAD)">
        <input type="text" id="luma" placeholder="Colle le lien Luma complet ici">
        <button class="btn" onclick="process()">GÉNÉRER LE CODE CLIENT</button>
        
        <div id="result" class="qr-card" style="display:none;">
            <div id="qrcode"></div>
            <p id="link-text" style="font-size:10px; margin-top:10px; word-break:break-all;"></p>
        </div>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    
    // Mode Admin
    if(window.location.hash === "#admin") {
        document.getElementById('client-view').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
    } 
    // Mode Client
    else if(params.get('id')) {
        const id = params.get('id');
        document.getElementById('mv').src = `https://cdn-luma.com/${id}/model.glb`;
        document.getElementById('mv').iosSrc = `https://cdn-luma.com/${id}/model.usdz`;
        document.getElementById('c-name').innerText = params.get('name');
        document.getElementById('c-price').innerText = params.get('price');
    }

    function process() {
        const rawLuma = document.getElementById('luma').value;
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        
        // Nettoyage de l'ID automatique (on prend la dernière partie du lien)
        const parts = rawLuma.split('/');
        const id = parts[parts.length - 1] || parts[parts.length - 2];

        const finalUrl = window.location.origin + window.location.pathname + "?id=" + id + "&name=" + encodeURIComponent(n) + "&price=" + encodeURIComponent(p);

        document.getElementById('result').style.display = 'block';
        document.getElementById('qrcode').innerHTML = "";
        
        // Création du QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: finalUrl,
            width: 200,
            height: 200
        });
        
        document.getElementById('link-text').innerText = finalUrl;
    }
</script>
</body>
</html>
