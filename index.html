<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLATO | Gastronomie Augmentée</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;700&family=Syne:wght@800&display=swap');
        
        :root { --accent: #FF4D00; --bg: #0A0A0A; --card: #151515; }
        
        body, html { margin: 0; padding: 0; font-family: 'Instrument Sans', sans-serif; background: #fff; height: 100%; color: #000; overflow: hidden; }

        /* --- VUE CLIENT PREMIUM --- */
        #client-view { height: 100%; position: relative; background: #fdfdfd; }
        
        model-viewer { 
            width: 100%; height: 100%; 
            --progress-bar-color: var(--accent);
            --poster-color: transparent;
            background-color: #fdfdfd;
        }

        .client-header {
            position: absolute; top: 0; width: 100%; padding: 25px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        .logo-plato { font-family: 'Syne'; font-size: 22px; letter-spacing: -1px; }

        .client-card {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px); border-radius: 30px; padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; border: 1px solid rgba(255,255,255,0.5);
        }

        h1 { margin: 0; font-family: 'Syne'; font-size: 26px; }
        .price { color: var(--accent); font-weight: 700; font-size: 18px; margin: 5px 0 15px 0; }
        
        .btn-main {
            background: var(--accent); color: white; border: none; padding: 18px 30px;
            border-radius: 100px; font-weight: 700; font-size: 16px; width: 100%;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(255, 77, 0, 0.3);
        }

        /* --- VUE ADMIN DARK MODE --- */
        #admin-panel { display: none; padding: 30px; background: var(--bg); height: 100vh; color: white; overflow-y: auto; }
        .input-group { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #222; }
        input { 
            width: 100%; background: #000; border: 1px solid #333; padding: 15px; 
            border-radius: 12px; color: white; margin-top: 10px; font-size: 16px; box-sizing: border-box;
        }
        .qr-output { background: white; padding: 30px; border-radius: 30px; color: black; text-align: center; margin-top: 20px; }
        #qrcode { display: flex; justify-content: center; margin-bottom: 15px; }

        /* --- ANIMATIONS --- */
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="client-view">
        <div class="client-header">
            <div class="logo-plato">PLATO.</div>
        </div>
        
        <model-viewer id="mv" ar ar-modes="scene-viewer quick-look webxr" camera-controls shadow-intensity="1.5" auto-rotate exposure="1.1">
            <div class="client-card fade-in">
                <h1 id="c-name">Expérience PLATO</h1>
                <div class="price" id="c-price">Scannez un menu</div>
                <button slot="ar-button" class="btn-main">✨ VOIR LE PLAT EN RÉEL</button>
            </div>
        </model-viewer>
    </div>

    <div id="admin-panel">
        <h1 style="font-family: 'Syne'; margin-bottom: 30px;">Configuration<br><span style="color:var(--accent)">PLATO</span></h1>
        
        <div class="input-group">
            <label>Nom du plat</label>
            <input type="text" id="name" placeholder="ex: Couscous Royal">
            <label style="display:block; margin-top:15px;">Prix</label>
            <input type="text" id="price" placeholder="ex: 95.00 MAD">
            <label style="display:block; margin-top:15px;">ID ou Lien Luma</label>
            <input type="text" id="luma" placeholder="Collez le lien Luma">
            <button class="btn-main" style="margin-top:25px;" onclick="process()">GÉNÉRER LE QR CODE</button>
        </div>
        
        <div id="result" class="qr-output" style="display:none;">
            <div id="qrcode"></div>
            <p id="link-text" style="font-size:11px; color:#666; word-break:break-all;"></p>
            <button class="btn-main" style="background:#000; margin-top:15px;" onclick="window.print()">IMPRIMER LE CODE</button>
        </div>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    
    // Switch Admin/Client
    if(window.location.hash === "#admin") {
        document.getElementById('client-view').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
    } else if(params.get('id')) {
        const id = params.get('id');
        const mv = document.getElementById('mv');
        mv.src = `https://cdn-luma.com/${id}/model.glb`;
        mv.iosSrc = `https://cdn-luma.com/${id}/model.usdz`;
        document.getElementById('c-name').innerText = decodeURIComponent(params.get('name'));
        document.getElementById('c-price').innerText = decodeURIComponent(params.get('price'));
    }

    function process() {
        const rawLuma = document.getElementById('luma').value;
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        
        // Nettoyage intelligent de l'URL Luma
        let id = rawLuma.trim();
        if(id.includes('/')) {
            const parts = id.split('/');
            id = parts.pop() || parts.pop();
        }

        const finalUrl = `${window.location.origin}${window.location.pathname}?id=${id}&name=${encodeURIComponent(n)}&price=${encodeURIComponent(p)}`;

        document.getElementById('result').style.display = 'block';
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: finalUrl, width: 220, height: 220 });
        document.getElementById('link-text').innerText = finalUrl;
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>
</body>
</html>
